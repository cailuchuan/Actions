name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4

    - name: Compile Swift to App
      run: |
        mkdir -p Payload/Translator.app
        cp Info.plist Payload/Translator.app/
        xcrun -sdk iphoneos swiftc -target arm64-apple-ios16.0 -parse-as-library ContentView.swift -o Payload/Translator.app/Translator
        echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?><plist version=\"1.0\"><dict><key>CFBundleExecutable</key><string>Translator</string><key>CFBundleIdentifier</key><string>com.test.translator</string><key>CFBundleName</key><string>Translator</string><key>CFBundleVersion</key><string>1.0</string></dict></plist>" > Payload/Translator.app/Info.plist

    - name: Package to IPA
      run: |
        zip -r Translator.ipa Payload

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-IPA
        path: Translator.ipa
