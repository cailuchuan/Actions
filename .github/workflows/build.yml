name: Build TrollStore IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release unsigned App
        run: |
          xcodebuild -project MovieJA2ZH.xcodeproj -scheme MovieJA2ZH -configuration Release -derivedDataPath build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MovieJA2ZH.app Payload/
          zip -q -r MovieJA2ZH.ipa Payload

      - name: Release IPA
        uses: softprops/action-gh-release@v2
        with:
          files: MovieJA2ZH.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}