name: Build Unsigned IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Compile with Background Audio
      run: |
        mkdir -p Payload/Translator.app
        cp Info.plist Payload/Translator.app/
        xcrun -sdk iphoneos swiftc -target arm64-apple-ios16.0 -parse-as-library ContentView.swift -o Payload/Translator.app/Translator
        zip -r Translator.ipa Payload
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-IPA
        path: Translator.ipa
