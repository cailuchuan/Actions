name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

    - name: Build and Archive
      run: |
        # 这里假设你的主工程叫 RealtimeTranslator.xcodeproj，Scheme 叫 RealtimeTranslator
        xcodebuild -project RealtimeTranslator.xcodeproj \
          -scheme RealtimeTranslator \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath ./build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package to IPA
      run: |
        mkdir Payload
        cp -r ./build/Build/Products/Release-iphoneos/RealtimeTranslator.app Payload/
        zip -r RealtimeTranslator.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-IPA
        path: RealtimeTranslator.ipa
